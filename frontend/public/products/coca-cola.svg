<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 280" fill="none">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b50007"/>
      <stop offset="35%" stop-color="#f40009"/>
      <stop offset="65%" stop-color="#ff3a3f"/>
      <stop offset="100%" stop-color="#a00007"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#222"/>
      <stop offset="50%" stop-color="#555"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Bottle body -->
  <g filter="url(#shadow)">
    <!-- neck -->
    <rect x="44" y="18" width="32" height="8" rx="4" fill="url(#cap)"/>
    <!-- shoulder -->
    <path d="M44 26 Q30 50 26 70 L26 200 Q26 215 40 220 L80 220 Q94 215 94 200 L94 70 Q90 50 76 26 Z" fill="url(#body)"/>
    <!-- hip taper -->
    <path d="M26 200 Q26 235 40 242 L80 242 Q94 235 94 200 Z" fill="url(#body)"/>
    <!-- base -->
    <ellipse cx="60" cy="242" rx="21" ry="6" fill="#8a0005" opacity="0.8"/>
  </g>

  <!-- cap -->
  <rect x="44" y="10" width="32" height="18" rx="5" fill="url(#cap)"/>
  <rect x="46" y="10" width="28" height="4" rx="2" fill="#777"/>

  <!-- label area -->
  <rect x="30" y="85" width="60" height="110" rx="4" fill="white" opacity="0.12"/>

  <!-- Shine -->
  <path d="M44 26 Q30 50 26 70 L26 200 Q26 215 40 220 L44 220 L44 26 Z" fill="url(#shine)"/>

  <!-- Coca-Cola wave white -->
  <path d="M28 155 Q45 148 60 155 Q75 162 92 155" stroke="white" stroke-width="2.5" fill="none" stroke-opacity="0.55" stroke-linecap="round"/>
  <path d="M28 163 Q45 156 60 163 Q75 170 92 163" stroke="white" stroke-width="1.5" fill="none" stroke-opacity="0.3" stroke-linecap="round"/>

  <!-- Coca-Cola text -->
  <text x="60" y="120" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-weight="900" font-size="13" fill="white" letter-spacing="-0.5">Coca-Cola</text>

  <!-- "ORIGINAL TASTE" -->
  <text x="60" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="5.5" fill="white" letter-spacing="1.5" opacity="0.75">ORIGINAL TASTE</text>

  <!-- 500 ML -->
  <text x="60" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="8" fill="white" opacity="0.6">500 mL</text>

  <!-- Red circle logo hint -->
  <circle cx="60" cy="100" r="10" fill="none" stroke="white" stroke-width="1.5" opacity="0.4"/>
</svg>
