<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 280" fill="none">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8e8ff"/>
      <stop offset="35%" stop-color="#e8f6ff"/>
      <stop offset="65%" stop-color="#f5fbff"/>
      <stop offset="100%" stop-color="#b0d8f8"/>
    </linearGradient>
    <linearGradient id="bodyFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f4ff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#b8e0ff" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#90c8f0" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#006db0"/>
      <stop offset="50%" stop-color="#0090e0"/>
      <stop offset="100%" stop-color="#0060a0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="35%" stop-color="white" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="white" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#0066aa" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="44" y="18" width="32" height="8" rx="4" fill="#0070b8"/>
    <path d="M44 26 Q30 50 26 70 L26 200 Q26 215 40 220 L80 220 Q94 215 94 200 L94 70 Q90 50 76 26 Z" fill="url(#bodyFill)"/>
    <path d="M26 200 Q26 235 40 242 L80 242 Q94 235 94 200 Z" fill="url(#bodyFill)"/>
    <ellipse cx="60" cy="242" rx="21" ry="6" fill="#80c0e8" opacity="0.6"/>
  </g>

  <!-- body outline -->
  <path d="M44 26 Q30 50 26 70 L26 200 Q26 215 40 220 L80 220 Q94 215 94 200 L94 70 Q90 50 76 26 Z" fill="none" stroke="#90c8e8" stroke-width="1.5"/>

  <rect x="44" y="10" width="32" height="18" rx="5" fill="url(#cap)"/>
  <rect x="46" y="10" width="28" height="4" rx="2" fill="#44aaee"/>

  <!-- water wave fill -->
  <path d="M26 160 Q40 155 55 162 Q70 169 94 160 L94 200 Q94 215 80 220 L40 220 Q26 215 26 200 Z" fill="#0080cc" opacity="0.18"/>

  <!-- label bg -->
  <rect x="30" y="86" width="60" height="105" rx="4" fill="#0070c0" opacity="0.12"/>

  <!-- shine -->
  <path d="M44 26 Q30 50 26 70 L26 200 Q26 215 40 220 L42 220 L42 26 Z" fill="url(#shine)"/>

  <!-- water drop icon -->
  <path d="M60 88 Q54 98 54 104 Q54 111 60 111 Q66 111 66 104 Q66 98 60 88 Z" fill="#0080cc" opacity="0.6"/>

  <!-- BonAqua text -->
  <text x="60" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="10" fill="#004080" letter-spacing="0">BON</text>
  <text x="60" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="10" fill="#0070c0" letter-spacing="0.5">AQUA</text>

  <!-- wave lines -->
  <path d="M30 152 Q45 147 60 152 Q75 157 90 152" stroke="#0080cc" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M30 159 Q45 154 60 159 Q75 164 90 159" stroke="#0080cc" stroke-width="1.5" fill="none" opacity="0.25" stroke-linecap="round"/>

  <text x="60" y="186" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="8" fill="#004080" opacity="0.6">500 mL</text>
</svg>
