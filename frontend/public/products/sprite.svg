<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 280" fill="none">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#007a3c"/>
      <stop offset="35%" stop-color="#00b050"/>
      <stop offset="65%" stop-color="#00cc60"/>
      <stop offset="100%" stop-color="#006030"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111"/>
      <stop offset="50%" stop-color="#333"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="44" y="18" width="32" height="8" rx="4" fill="#111"/>
    <path d="M44 26 Q30 50 26 70 L26 200 Q26 215 40 220 L80 220 Q94 215 94 200 L94 70 Q90 50 76 26 Z" fill="url(#body)"/>
    <path d="M26 200 Q26 235 40 242 L80 242 Q94 235 94 200 Z" fill="url(#body)"/>
    <ellipse cx="60" cy="242" rx="21" ry="6" fill="#004020" opacity="0.8"/>
  </g>

  <rect x="44" y="10" width="32" height="18" rx="5" fill="url(#cap)"/>
  <rect x="46" y="10" width="28" height="4" rx="2" fill="#555"/>

  <rect x="28" y="82" width="64" height="118" rx="4" fill="white" opacity="0.12"/>
  <path d="M44 26 Q30 50 26 70 L26 200 Q26 215 40 220 L44 220 L44 26 Z" fill="url(#shine)"/>

  <!-- star bubbles -->
  <circle cx="50" cy="94" r="2.5" fill="#7dffb0" opacity="0.5"/>
  <circle cx="70" cy="90" r="2" fill="#7dffb0" opacity="0.4"/>
  <circle cx="38" cy="102" r="1.5" fill="#7dffb0" opacity="0.35"/>
  <circle cx="80" cy="100" r="2" fill="#7dffb0" opacity="0.3"/>

  <!-- Sprite text -->
  <text x="60" y="125" text-anchor="middle" font-family="Arial Rounded MT Bold,Arial,sans-serif" font-weight="900" font-size="16" fill="white" letter-spacing="-1">Sprite</text>
  <text x="60" y="139" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="6.5" fill="white" letter-spacing="0.8" opacity="0.75">ЛИМОН И ЛАЙМ</text>

  <!-- green wave -->
  <path d="M28 155 Q45 149 60 155 Q75 161 92 155" stroke="#7dffb0" stroke-width="2.5" fill="none" opacity="0.45" stroke-linecap="round"/>

  <text x="60" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="8" fill="white" opacity="0.55">1 L</text>
</svg>
