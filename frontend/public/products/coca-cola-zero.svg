<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 280" fill="none">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="35%" stop-color="#1c1c1c"/>
      <stop offset="65%" stop-color="#333"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a0005"/>
      <stop offset="50%" stop-color="#f40009"/>
      <stop offset="100%" stop-color="#8a0005"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="44" y="18" width="32" height="8" rx="4" fill="#222"/>
    <path d="M44 26 Q30 50 26 70 L26 200 Q26 215 40 220 L80 220 Q94 215 94 200 L94 70 Q90 50 76 26 Z" fill="url(#body)"/>
    <path d="M26 200 Q26 235 40 242 L80 242 Q94 235 94 200 Z" fill="url(#body)"/>
    <ellipse cx="60" cy="242" rx="21" ry="6" fill="#000" opacity="0.8"/>
  </g>

  <rect x="44" y="10" width="32" height="18" rx="5" fill="url(#cap)"/>
  <rect x="46" y="10" width="28" height="4" rx="2" fill="#ff5555"/>

  <rect x="30" y="85" width="60" height="110" rx="4" fill="white" opacity="0.06"/>
  <path d="M44 26 Q30 50 26 70 L26 200 Q26 215 40 220 L44 220 L44 26 Z" fill="url(#shine)"/>

  <!-- Red accent stripe -->
  <rect x="26" y="148" width="68" height="18" fill="#f40009" opacity="0.9"/>

  <!-- ZERO text on red stripe -->
  <text x="60" y="161" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="11" fill="white" letter-spacing="3">ZERO</text>

  <text x="60" y="120" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-weight="900" font-size="13" fill="white" letter-spacing="-0.5">Coca-Cola</text>
  <text x="60" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="5" fill="white" letter-spacing="1.5" opacity="0.65">ZERO SUGAR</text>

  <text x="60" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="8" fill="white" opacity="0.5">500 mL</text>

  <path d="M28 175 Q45 168 60 175 Q75 182 92 175" stroke="#f40009" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
</svg>
