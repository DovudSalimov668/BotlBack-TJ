<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 280" fill="none">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d45500"/>
      <stop offset="35%" stop-color="#ff7300"/>
      <stop offset="65%" stop-color="#ff9a3c"/>
      <stop offset="100%" stop-color="#c04800"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#222"/>
      <stop offset="50%" stop-color="#444"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="44" y="18" width="32" height="8" rx="4" fill="#222"/>
    <path d="M44 26 Q30 50 26 70 L26 200 Q26 215 40 220 L80 220 Q94 215 94 200 L94 70 Q90 50 76 26 Z" fill="url(#body)"/>
    <path d="M26 200 Q26 235 40 242 L80 242 Q94 235 94 200 Z" fill="url(#body)"/>
    <ellipse cx="60" cy="242" rx="21" ry="6" fill="#b04000" opacity="0.8"/>
  </g>

  <rect x="44" y="10" width="32" height="18" rx="5" fill="url(#cap)"/>
  <rect x="46" y="10" width="28" height="4" rx="2" fill="#666"/>

  <rect x="28" y="82" width="64" height="118" rx="4" fill="white" opacity="0.14"/>
  <path d="M44 26 Q30 50 26 70 L26 200 Q26 215 40 220 L44 220 L44 26 Z" fill="url(#shine)"/>

  <!-- orange circles decoration -->
  <circle cx="48" cy="95" r="5" fill="#ffb800" opacity="0.55"/>
  <circle cx="72" cy="90" r="3.5" fill="#ffb800" opacity="0.4"/>
  <circle cx="38" cy="105" r="3" fill="#ffb800" opacity="0.35"/>

  <!-- Fanta logo text -->
  <text x="60" y="125" text-anchor="middle" font-family="Arial Rounded MT Bold,Arial,sans-serif" font-weight="900" font-size="18" fill="white" letter-spacing="-0.5">Fanta</text>
  <text x="60" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="7" fill="white" letter-spacing="1" opacity="0.8">АПЕЛЬСИН</text>

  <!-- wave -->
  <path d="M28 155 Q45 148 60 155 Q75 162 92 155" stroke="white" stroke-width="2.5" fill="none" opacity="0.45" stroke-linecap="round"/>

  <text x="60" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="8" fill="white" opacity="0.55">500 mL</text>
</svg>
